spring.application.name=actividadenclase

# Cambia DB_USER y DB_PASSWORD aquí o defínelos como variables de entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/directorio_funcionarios?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:directorio_app}
spring.datasource.password=${DB_PASSWORD:CambiaEstaClave123!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Comprueba que la tabla creada por el script SQL coincida con la entidad Java.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Puerto HTTP en el que se sirve la página y la API.
server.port=${SERVER_PORT:8080}

# ---------- Sesión y cookies ----------
# "Secure" exige HTTPS: en desarrollo local (http://localhost) se deja en false.
# Pon SESSION_COOKIE_SECURE=true cuando la aplicación quede detrás de HTTPS.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m

# ---------- Requisitos de contraseña (registro) ----------
app.password-policy.longitud-minima=${PWD_MIN_LENGTH:8}
app.password-policy.longitud-maxima=${PWD_MAX_LENGTH:72}
app.password-policy.requiere-mayuscula=${PWD_REQUIERE_MAYUSCULA:true}
app.password-policy.requiere-minuscula=${PWD_REQUIERE_MINUSCULA:true}
app.password-policy.requiere-numero=${PWD_REQUIERE_NUMERO:true}
app.password-policy.requiere-caracter-especial=${PWD_REQUIERE_ESPECIAL:true}

# ---------- Bloqueo por intentos fallidos ----------
app.lockout.max-intentos=${LOCKOUT_MAX_INTENTOS:3}
app.lockout.segundos-bloqueo=${LOCKOUT_SEGUNDOS:30}
app.lockout.max-intentos-por-ip=${LOCKOUT_MAX_INTENTOS_IP:20}
app.lockout.minutos-ventana-ip=${LOCKOUT_MINUTOS_VENTANA_IP:15}
