# Perfil solo para pruebas automatizadas: usa una base de datos H2 en memoria,
# nunca la MySQL real de desarrollo. Cada ejecución empieza con el esquema vacío.
spring.datasource.url=jdbc:h2:mem:directorio_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Bloqueo rápido para que las pruebas de bloqueo/desbloqueo no tengan que esperar minutos reales.
app.lockout.max-intentos=3
app.lockout.segundos-bloqueo=30
app.lockout.max-intentos-por-ip=1000
app.lockout.minutos-ventana-ip=15
